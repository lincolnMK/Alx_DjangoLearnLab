{% extends "blog/base.html" %}
{% block content %}
<div class="container mt-3">
    <h5>Are you sure you want to delete this comment?</h5>
    <p class="text-muted">{{ object.content }}</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{{ object.post.get_absolute_url }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
