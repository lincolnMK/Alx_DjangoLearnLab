{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
    <nav>
        <ul>
            <li><a href="{% url 'home' %}">Home</a></li>

            {% if user.is_authenticated %}
                <li><a href="{% url 'profile' %}">My Profile</a></li>
                <li><a href="{% url 'post-list' %}">Blogs</a></li>
                <li>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit">Logout</button>
                    </form>
                </li>
            {% else %}
                <li><a href="{% url 'login' %}">Login</a></li>
                <li><a href="{% url 'register' %}">Register</a></li>
                <li><a href="{% url 'post-list' %}">Blogs</a></li>
            {% endif %}

            <li>
                <form class="d-flex" method="GET" action="{% url 'post-search' %}">
                    <input class="form-control me-2" type="search" name="q" placeholder="Search posts..." value="{{ request.GET.q }}">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
            </li>
        </ul>
    </nav>
</header>

    <div class="content">
        {% block content %}
        <!-- Page-specific content goes here -->
        {% endblock %}
    </div>

    <footer>
        <p>&copy; 2024 Django Blog</p>
    </footer>

    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
