{% extends "blog/base.html" %}
{% block content %}

<div class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2>{{ object.title }}</h2>
            <p class="text-muted">
                By {{ object.author.username }} |
                {{ object.published_date|date:"M d, Y H:i" }}
            </p>

            <hr>

            <p>{{ object.content|linebreaks }}</p>

            {% if user == object.author %}
                <a href="{% url 'post-update' object.pk %}" class="btn btn-warning btn-sm">
                    Edit
                </a>
                <a href="{% url 'post-delete' object.pk %}" class="btn btn-danger btn-sm">
                    Delete
                </a>
            {% endif %}

            <a href="{% url 'post-list' %}" class="btn btn-secondary btn-sm">
                Back to Posts
            </a>
        </div>
    </div>
</div>

{% endblock %}
